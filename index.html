<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>
    <fieldset id="regisztracio">
            <form  onsubmit="ellenorzes(event)">
                <label for="fnev">Felhasznalonev:</label><br>
                <input type="text" id="fnev" name="fnev"><br>
                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email"><br><br>
                <button>Indítás</button>
            </form> 
            <p id="hibauzenet"></p>
    </fieldset>

    <div id="container" style="display: none;">
        <h1>Kő - Papír - Olló</h1>
        <h2>Válassz!</h2>
        <div id="valasztasok">
            <img id="ko" src="img/ko.png" alt="ko" onclick="jatszas('ko')">
            <img id="papir" src="img/papir.png" alt="papir" onclick="jatszas('papir')">
            <img id="ollo" src="img/ollo.png" alt="ollo" onclick="jatszas('ollo')">
        </div>
        <h2>Gép választása</h2>
        <div>
            <img id="gep_valasztas" src="img/ko.png" alt="">
        </div>
        <p id="eredmeny">Eredmeny: Te nyertél!</p>
        <p id="jatekosPont" ></p>
        <p id="te_pontod"></p>
        <p> Gép pontjai</p>
        <p id="gep_pontok"></p>

         <button onclick="ujJatek()">Új játék</button>

    </div>
</body>
<script src="app.js"></script>
</html>
